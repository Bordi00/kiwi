<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="kiwi">
  <title>kiwi</title>
  <!-- skin -->
  <circle cx="64" cy="64" r="60" fill="#5E7F2B"/>
  <!-- flesh -->
  <circle cx="64" cy="64" r="53" fill="#9BC83F"/>
  <circle cx="64" cy="64" r="44" fill="#AED651"/>
  <!-- radial lines: the fruit's fibres, and the edges of a graph -->
  <g stroke="#EEF7CF" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="64" y1="46" x2="64" y2="16"/>
    <line x1="64" y1="46" x2="64" y2="16" transform="rotate(45 64 64)"/>
    <line x1="64" y1="46" x2="64" y2="16" transform="rotate(90 64 64)"/>
    <line x1="64" y1="46" x2="64" y2="16" transform="rotate(135 64 64)"/>
    <line x1="64" y1="46" x2="64" y2="16" transform="rotate(180 64 64)"/>
    <line x1="64" y1="46" x2="64" y2="16" transform="rotate(225 64 64)"/>
    <line x1="64" y1="46" x2="64" y2="16" transform="rotate(270 64 64)"/>
    <line x1="64" y1="46" x2="64" y2="16" transform="rotate(315 64 64)"/>
  </g>
  <!-- seeds: the nodes -->
  <g fill="#2B3318">
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(22.5 64 64)"/>
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(67.5 64 64)"/>
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(112.5 64 64)"/>
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(157.5 64 64)"/>
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(202.5 64 64)"/>
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(247.5 64 64)"/>
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(292.5 64 64)"/>
    <ellipse cx="64" cy="35" rx="3.2" ry="5.6" transform="rotate(337.5 64 64)"/>
  </g>
  <!-- core -->
  <circle cx="64" cy="64" r="14" fill="#F4FADF"/>
</svg>
